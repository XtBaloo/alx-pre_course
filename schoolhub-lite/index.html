<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchoolHub Lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>SchoolHub <span>Lite</span></h1>
    <nav id="tabs">
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="students">Students</button>
      <button data-tab="courses">Courses</button>
      <button data-tab="grades">Grades</button>
      <button data-tab="attendance">Attendance</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard -->
    <section id="dashboard" class="panel active">
      <div class="stats">
        <div class="stat"><span id="stat-students">0</span><small>Students</small></div>
        <div class="stat"><span id="stat-courses">0</span><small>Courses</small></div>
        <div class="stat"><span id="stat-avg">–</span><small>Average grade</small></div>
        <div class="stat"><span id="stat-attendance">–</span><small>Attendance rate</small></div>
      </div>
      <h2>Top students</h2>
      <div class="table-wrap"><table><thead><tr><th>Student</th><th>Average</th><th>Grades</th></tr></thead>
        <tbody id="top-students"></tbody></table></div>
      <div class="actions">
        <button id="export-btn" class="secondary">Export data (JSON)</button>
        <label class="secondary file-btn">Import data<input type="file" id="import-input" accept="application/json" hidden></label>
        <button id="reset-btn" class="danger">Reset all data</button>
      </div>
    </section>

    <!-- Students -->
    <section id="students" class="panel">
      <form id="student-form" class="row-form">
        <input name="name" placeholder="Full name" required>
        <input name="email" type="email" placeholder="Email (optional)">
        <input name="grade" placeholder="Class / year (e.g. Grade 7)">
        <button type="submit">Add student</button>
      </form>
      <input id="student-search" class="search" placeholder="Search students…">
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Class</th><th>Courses</th><th></th></tr></thead>
        <tbody id="student-list"></tbody></table></div>
    </section>

    <!-- Courses -->
    <section id="courses" class="panel">
      <form id="course-form" class="row-form">
        <input name="code" placeholder="Code (e.g. MATH101)" required>
        <input name="title" placeholder="Title" required>
        <input name="teacher" placeholder="Teacher">
        <button type="submit">Add course</button>
      </form>
      <div id="course-list" class="cards"></div>
    </section>

    <!-- Grades -->
    <section id="grades" class="panel">
      <form id="grade-form" class="row-form">
        <select name="studentId" required></select>
        <select name="courseId" required></select>
        <input name="label" placeholder="Assessment (e.g. Quiz 1)" required>
        <input name="score" type="number" min="0" max="100" step="0.1" placeholder="Score /100" required>
        <button type="submit">Record grade</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Student</th><th>Course</th><th>Assessment</th><th>Score</th><th>Letter</th><th></th></tr></thead>
        <tbody id="grade-list"></tbody></table></div>
    </section>

    <!-- Attendance -->
    <section id="attendance" class="panel">
      <form id="attendance-form" class="row-form">
        <select name="courseId" required></select>
        <input name="date" type="date" required>
        <button type="submit">Load roster</button>
      </form>
      <div id="roster"></div>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
